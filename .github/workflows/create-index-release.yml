name: "Index Roblox Documentation"

on:
  workflow_dispatch:
    inputs:
      enable_questions:
        description: "Enable question generation (increases cost and index size)"
        required: false
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install python dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Restore indexer cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: indexer-cache-${{ hashFiles('indexer/config.py', 'indexer/cache.py') }}
          restore-keys: |
            indexer-cache-

      - name: Index documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          poetry run python indexer/main.py ${{ inputs.enable_questions == true && '--enable-questions' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: build

      - name: Get release info
        id: release_info
        run: |
          echo "timestamp=$(date +%m-%d-%y)" >> $GITHUB_OUTPUT
          echo 'release_body<<EOF' >> $GITHUB_OUTPUT
          echo "$(cat build/summary.md)" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: "Roblox Documentation Index ${{ steps.release_info.outputs.timestamp }}"
          body: "${{ steps.release_info.outputs.release_body }}"
          tag: "roblox-documentation.${{ steps.release_info.outputs.timestamp }}"
          artifacts: "build/index.json, build/docs-source-commit.txt, build/api-source-commit.txt"
          skipIfReleaseExists: false
